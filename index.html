<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unacceptable.dev</title>
<meta name="description" content="unacceptable.dev — society is glitching. Report the bug.">
<link rel="canonical" href="https://unacceptable.dev/">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Palette copied by hand from notso.dev, never imported — the two repos
     share no code (CLAUDE.md, "Siloing"). Same tokens on purpose: one
     universe, two halves. --phosphor is the correction in both; there it
     paints "not", here it paints "un". */
  :root{
    --ink:      #0b0c0e;   /* background, cool near-black        */
    --lift:     #14171c;   /* faint center lift                  */
    --bone:     #ede8df;   /* acceptable.dev — warm, stable      */
    --phosphor: #ff6b35;   /* the "un" — bright ember correction */
    --mute:     #565a61;   /* utility text                       */
    --rule:     #23262c;   /* hairlines                          */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ height:100%; }

  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% 34%, var(--lift) 0%, var(--ink) 62%);
    background-attachment:fixed;
    color:var(--bone);
    font-family:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    display:grid;
    grid-template-rows:1fr auto;
    justify-items:center;
    align-items:center;
    padding:clamp(1.25rem, 4vw, 2.5rem);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- stage ------------------------------------------------------ */
  .stage{
    grid-row:1;
    width:100%;
    max-width:44rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1rem, 3vw, 1.6rem);
    text-align:center;
    padding-block:clamp(1.5rem, 5vw, 3rem);
  }

  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1rem, 3vw, 1.6rem);
    opacity:0;
    animation:rise 900ms 120ms ease-out forwards;
  }

  .wordmark{
    font-weight:700;
    font-size:clamp(1.8rem, 7.6vw, 4rem);
    line-height:1;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }

  /* The "un" arrives in front of a word that is already settled, so it must
     occupy its slot from the first frame — only opacity animates, never
     display/width/position. Nothing reflows when it appears. */
  .un{
    display:inline-block;
    color:var(--phosphor);
    opacity:0;
    animation:unin 900ms 1150ms ease-out forwards;
  }
  .acceptable{ color:var(--bone); }

  .meta{
    font-size:clamp(0.72rem, 2vw, 0.86rem);
    letter-spacing:0.06em;
    color:var(--mute);
    opacity:0;
    animation:rise 900ms 1500ms ease-out forwards;
  }

  /* ---- terminal --------------------------------------------------- */
  .terminal{
    width:100%;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:0.9rem;
    opacity:0;
    animation:rise 900ms 1700ms ease-out forwards;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    border-bottom:1px solid var(--rule);
    padding-bottom:0.6rem;
  }
  .field:focus-within{ border-bottom-color:var(--phosphor); }

  .ps1{
    color:var(--phosphor);
    font-size:clamp(0.78rem, 2.1vw, 0.92rem);
    white-space:nowrap;
    user-select:none;
  }

  /* THE ONE CARET ON THE PAGE. A blinking _ is an affordance: it says "type
     here". Put it on a tagline, a title, a punchline or a footer and people
     click THAT and never find the real box — which is exactly what happened on
     notso.dev and was fixed 2026-08-26. It lives on the prompt label of the
     confession field and nowhere else. Do not add a decorative second one.
     The delay must start AFTER .terminal's reveal ends (900ms + 1700ms), or it
     blinks inside a still-invisible element. */
  .ps1 .cursor{
    display:inline-block;
    width:0.6ch;
    animation:blink 1.15s steps(1) 2800ms infinite;
  }

  /* Once focused, the browser paints its own caret in the textarea. Two
     cursors on one field is worse than none, so ours gets out of the way. */
  .field:focus-within .ps1 .cursor{ animation:none; opacity:0; }

  #confession{
    width:100%;
    min-height:7.5rem;
    resize:vertical;
    background:transparent;
    border:0;
    outline:0;
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.82rem, 2.2vw, 0.95rem);
    line-height:1.65;
    caret-color:var(--phosphor);
    padding:0.15rem 0;
  }
  #confession::placeholder{ color:var(--mute); }

  /* Display-only. Not an account, not verified, not a login — it exists so an
     approved confession can be credited if the owner publishes it. */
  .field--handle{
    flex-direction:row;
    align-items:baseline;
    gap:0.6ch;
    flex-wrap:wrap;
  }

  #handle{
    flex:1 1 12ch;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.78rem, 2.1vw, 0.9rem);
    caret-color:var(--phosphor);
    padding:0.15rem 0;
  }
  #handle::placeholder{ color:var(--mute); }

  /* Never name this element id="turnstile". An element id becomes a property
     of window, so <div id="turnstile"> makes window.turnstile the div itself;
     api.js finds it already set, logs "Turnstile already has been loaded" and
     aborts without rendering — with a warning that names the wrong cause.
     It must also stay GENUINELY visible: Turnstile refuses to build inside a
     hidden, zero-size or zero-opacity container, so this only moves, scales
     and dims it. Never display:none / visibility:hidden / opacity:0 here. */
  #ts-widget{
    position:fixed;
    left:clamp(0.75rem, 2vw, 1.25rem);
    bottom:clamp(0.75rem, 2vw, 1.25rem);
    z-index:5;
    width:300px;
    height:65px;
    transform:scale(0.8);
    transform-origin:bottom left;
    opacity:0.5;
    transition:opacity 200ms ease;
  }
  /* full strength the moment it is deliberately looked at or interacted with */
  #ts-widget:hover,
  #ts-widget:focus-within{ opacity:1; }

  /* On short/narrow screens the fixed badge would land on the centred footer,
     so reserve a strip for it at the bottom of the page instead. */
  @media (max-width:52rem){
    body{ padding-bottom:5rem; }
    #ts-widget{ transform:scale(0.7); }
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:0.75rem;
    flex-wrap:wrap;
  }

  .gatemsg{
    color:var(--phosphor);
    font-size:clamp(0.7rem, 1.9vw, 0.8rem);
    line-height:1.6;
    max-width:46ch;
  }

  .btn{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--bone);
    font:inherit;
    font-size:clamp(0.72rem, 1.9vw, 0.82rem);
    letter-spacing:0.06em;
    padding:0.5rem 1.1rem;
    cursor:pointer;
    transition:border-color 160ms ease, color 160ms ease;
  }
  .btn:hover:not(:disabled),
  .btn:focus-visible{ border-color:var(--phosphor); color:var(--phosphor); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .out{
    display:block;
    font-size:clamp(0.82rem, 2.2vw, 0.95rem);
    line-height:1.65;
    white-space:pre-wrap;
    min-height:1.65em;
  }
  .out .line + .line{ margin-top:0.5rem; }
  .out .punch{ color:var(--phosphor); }
  .out .working{ color:var(--mute); }
  .out .err{ color:var(--phosphor); }

  /* ---- footer ----------------------------------------------------- */
  .site-foot{
    grid-row:2;
    width:100%;
    max-width:44rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.55rem;
    text-align:center;
    opacity:0;
    animation:rise 900ms 1800ms ease-out forwards;
    padding-bottom:clamp(0.5rem, 2vw, 1rem);
  }

  .foot-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:0.6rem 1.25rem;
    flex-wrap:wrap;
  }

  .tagline{
    font-size:clamp(0.68rem, 1.8vw, 0.8rem);
    letter-spacing:0.04em;
    color:var(--mute);
  }

  /* mailto: hands off to a mail client — not an external page, so no
     target/rel. Shown in full so it can still be copied when the browser
     has no mail handler. */
  .mailto{
    font-size:clamp(0.68rem, 1.8vw, 0.8rem);
    letter-spacing:0.04em;
    color:var(--mute);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color 160ms ease, border-color 160ms ease;
  }
  .mailto:hover,
  .mailto:focus-visible{ color:var(--phosphor); border-bottom-color:var(--phosphor); }

  /* The bridge to the other half. A plain hyperlink is the ONLY permitted
     connection between the two sites — no fetch, no import, no shared key. */
  .sibling{
    font-size:clamp(0.68rem, 1.8vw, 0.8rem);
    letter-spacing:0.04em;
    color:var(--mute);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color 160ms ease, border-color 160ms ease;
  }
  .sibling:hover,
  .sibling:focus-visible{ color:var(--phosphor); border-bottom-color:var(--phosphor); }

  /* ---- studio credit ----
     Copied by hand from notso.dev, never imported: the projects share no
     code. Same tokens, so it needs no re-tint. */
  .by{
    display:inline-block;
    padding:0.35rem 0.25rem;
    color:var(--rule);
    font-size:clamp(0.6rem, 1.5vw, 0.68rem);
    font-weight:700;
    letter-spacing:0.09em;
    line-height:1;
    text-decoration:none;
    white-space:nowrap;
    transition:color 250ms ease;
  }
  .by:hover,
  .by:focus-visible{ color:var(--mute); }
  .by__name{ color:var(--mute); }
  .by:hover .by__name,
  .by:focus-visible .by__name{ color:var(--bone); }

  /* the studio's mark, not punctuation */
  .by__mark{
    display:inline-block;
    margin-left:0.18em;
    font-size:0.74em;
    letter-spacing:0.03em;
    transform:translateY(-0.32em);
  }

  /* ---- motion ----------------------------------------------------- */
  /* One-shot reveal for the "un", settling at a resting glow. notso proved a
     continuous opacity loop on a large element reads as FLICKER at every
     amplitude and speed — there is no looping animation on the wordmark here
     and there must never be one. */
  @keyframes unin{
    from{ opacity:0; }
    to  { opacity:0.66; text-shadow:0 0 22px rgba(217,119,87,0.22); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(0.4rem); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  /* Pixel-identical to the animated END state, minus the travel. Anyone who
     set the OS preference gets a calm page from the first frame — never a
     degraded one. */
  @media (prefers-reduced-motion: reduce){
    .hero,.meta,.terminal,.site-foot{ opacity:1; animation:none; transform:none; }
    .un{ opacity:0.66; animation:none;
         text-shadow:0 0 22px rgba(217,119,87,0.22); }
    /* still, not gone: the caret is a signal ("type here"), not decoration.
       Reduced motion removes the blink, never the mark. */
    .ps1 .cursor{ animation:none; opacity:1; }
    .btn,.mailto,.sibling,.by{ transition:none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="hero">
      <h1 class="wordmark" aria-label="unacceptable.dev">
        <span class="un">un</span><span class="acceptable">acceptable.dev</span>
      </h1>
      <p class="meta">// Society is glitching. Report the bug.</p>
    </div>

    <section class="terminal">
      <div class="field">
        <label class="ps1" for="confession">guest@unacceptable:~$ confess<span class="cursor" aria-hidden="true">_</span></label>
        <textarea id="confession" maxlength="2000" rows="5"
                  autocomplete="off" autocapitalize="sentences" spellcheck="false"
                  placeholder="[ Describe the unacceptable behavior / incident / bug... ]"></textarea>
      </div>

      <div class="field field--handle">
        <label class="ps1" for="handle">--handle</label>
        <input id="handle" type="text" maxlength="60" autocomplete="off"
               autocapitalize="off" spellcheck="false"
               placeholder="[ optional — discord / socials, so you get the credit ]">
      </div>

      <div class="controls">
        <button id="void" class="btn" type="button">send to void</button>
        <button id="blog" class="btn" type="button">send to blog</button>
      </div>

      <div id="gatemsg" class="gatemsg"></div>

      <output id="out" class="out" for="confession" aria-live="polite"></output>
    </section>
  </main>

  <footer class="site-foot">
    <div class="foot-row">
      <!--email_off--><a class="mailto" href="mailto:human@unacceptable.dev">human@unacceptable.dev</a><!--/email_off-->
      <span class="tagline">society is glitching, every day.</span>
    </div>

    <div class="foot-row">
      <!-- The only bridge between the two sites: a hyperlink a human clicks.
           Never a fetch, never a shared token. -->
      <a class="sibling" href="https://notso.dev/" target="_blank" rel="noopener">the other half &rarr; notso.dev</a>
    </div>

    <!-- rel is "noopener" only, deliberately: noreferrer would hide that the
         traffic came from here, and attribution is the whole point. The "/>"
         is decorative, so it stays out of the accessible name. -->
    <a class="by" href="https://noustelos.gr/" target="_blank" rel="noopener">A <span class="by__name">NOUSTELOS_STUDIO</span> PROJECT<span class="by__mark" aria-hidden="true">/&gt;</span></a>
  </footer>

  <!-- Deliberately a direct child of <body>, NOT inside .terminal. An ancestor
       with any transform other than none becomes the containing block for its
       position:fixed descendants, and .terminal's `animation:rise ... forwards`
       parks it on transform:translateY(0) permanently. Nested, this badge would
       pin itself to the terminal's corner instead of the viewport's and land on
       top of the output text. Keep it out here. -->
  <div id="ts-widget" class="cf-turnstile"
       data-theme="dark"
       data-callback="onSuccess"
       data-error-callback="onError"
       data-expired-callback="onExpired"></div>

<script>
  /* ── THE HUMAN FILLS THIS IN ───────────────────────────────────────────
     unacceptable.dev's OWN Turnstile sitekey — do NOT paste notso.dev's.
     Public by design: the sitekey is 24 characters and safe in HTML. The
     35-character SECRET never appears in this file; it lives only as a
     Pages secret (TURNSTILE_SECRET_KEY). If what you paste here is 35
     characters, you have the wrong one.
     Local layout work: use Cloudflare's always-pass TEST sitekey — a real
     key shows error 110200 (unknown domain) on localhost, which is expected
     and not a bug.                                                        */
  const TURNSTILE_SITE_KEY = "REPLACE_ME";

  const confession = document.getElementById("confession");
  const handle     = document.getElementById("handle");
  const voidBtn    = document.getElementById("void");
  const blogBtn    = document.getElementById("blog");
  const out        = document.getElementById("out");
  const slot       = document.getElementById("ts-widget");

  const MAX_CHARS = 2000;   /* mirrors the cap the Function enforces */

  let token   = "";     /* set by Turnstile's success callback, never polled */
  let pending = null;   /* a confession sent before the challenge resolved   */
  let busy    = false;
  let waitTimer = null;

  /* One source of truth for the sitekey: the constant above, written onto the
     element here. This inline script runs during parsing; api.js is deferred
     and therefore executes later, so the attribute is always in place before
     Turnstile scans for .cf-turnstile containers. */
  slot.dataset.sitekey = TURNSTILE_SITE_KEY;

  function print(text, cls){
    out.textContent = "";
    const frag = document.createDocumentFragment();
    for (const raw of String(text).split("\n")){
      const line = raw.trim();
      if (!line) continue;
      const div = document.createElement("div");
      /* a // line is the punchline — it gets the ember treatment */
      div.className = "line " + (cls || (line.startsWith("//") ? "punch" : ""));
      div.textContent = line;
      frag.appendChild(div);
    }
    out.appendChild(frag);
  }

  /* VOID — the whole point is that nothing leaves the browser. No fetch, no
     beacon, no analytics event, not even a length. The text is dropped on the
     floor here and there is nowhere else it could have gone. Anything added
     to this function that touches the network breaks the promise the button
     makes, so: keep it empty of I/O. */
  voidBtn.addEventListener("click", () => {
    const text = confession.value.trim();
    if (!text){
      print("// The void takes anything, but it needs something. Type first.", "err");
      return;
    }
    confession.value = "";
    print("// Error logged successfully. You are now clean.");
    confession.focus();
  });

  /* ---- BLOG path -------------------------------------------------------
     The other button. This one leaves the browser, so it is gated: a solved
     Turnstile, a length check, and the confession travels in the POST BODY —
     never a URL param, where it would land in logs, history and referrers. */

  function setBusy(state){
    busy = state;
    blogBtn.disabled = state;
    voidBtn.disabled = state;
    confession.disabled = state;
    handle.disabled = state;
  }

  /* Writes to its OWN element, never into #ts-widget: a diagnostic that
     empties the widget container destroys a working widget every time the
     detection is wrong. */
  function gateNote(msg){
    const el = document.getElementById("gatemsg");
    if (!el || el.dataset.noted) return;
    el.dataset.noted = "1";
    el.textContent = msg;
  }

  async function deliver(text, who){
    setBusy(true);
    print("filing your report with the only moderator we have...", "working");

    try {
      const res = await fetch("/api/confess", {
        method: "POST",
        headers: { "content-type": "application/json" },
        /* body, not query string */
        body: JSON.stringify({ confession: text, handle: who, turnstileToken: token }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok){
        print(data.error || "// Something broke on our end. Not your fault. Try again.", "err");
      } else {
        confession.value = "";
        print("// Filed. A human reads it next, then decides. No algorithm involved.");
      }
    } catch {
      print("// Couldn't reach the server. The void still works offline, though.", "err");
    } finally {
      /* Turnstile tokens are single-use: without this the second submit 403s. */
      token = "";
      resetWidget();
      setBusy(false);
      confession.focus();
    }
  }

  function sendToBlog(){
    if (busy) return;

    const text = confession.value.trim();
    const who  = handle.value.trim();

    if (!text){
      print("// You have to actually report something. Empty is the void's job.", "err");
      return;
    }
    if (text.length > MAX_CHARS){
      print("// That's a manifesto, not a bug report. Trim it under " + MAX_CHARS + " characters.", "err");
      return;
    }

    if (!token){
      /* Challenge still in flight. Queue it and fire the moment the token
         lands, rather than dead-ending and making them retype. */
      pending = { text, who };
      print("proving you're not a bot, which is ironic given the state of things...", "working");

      clearTimeout(waitTimer);
      waitTimer = setTimeout(() => {
        if (!pending) return;
        pending = null;
        print(widgetUp()
          ? "// The bot-check is still thinking. If there's a checkbox in the corner, tick it; otherwise reload."
          : "// The bot-check never showed up. See the note above — the void doesn't need it.", "err");
      }, 15000);
      return;
    }

    deliver(text, who);
  }

  blogBtn.addEventListener("click", sendToBlog);

  /* Implicit rendering: Turnstile builds the widget from the data-* attributes
     and calls these globals. No render(), no ready(), no onload — none of the
     initialisation orderings that break it can occur. */
  window.onSuccess = function(t){
    token = t;
    clearTimeout(waitTimer);
    if (pending && !busy){
      const p = pending; pending = null; deliver(p.text, p.who);
    }
  };

  window.onError = function(code){
    token = ""; pending = null; setBusy(false);
    console.error("turnstile error:", code);
    gateNote("// Cloudflare turned our bouncer away (code " + code + "). That's our end, not your browser.");
    return true;
  };

  window.onExpired = function(){ token = ""; resetWidget(); };

  function resetWidget(){
    token = "";
    try {
      if (window.turnstile && typeof window.turnstile.reset === "function"){
        window.turnstile.reset("#ts-widget");
      }
    } catch (err) { console.error("turnstile reset failed:", err); }
  }

  /* A rendered widget puts an iframe in the slot. That, not a guess about
     script state, is how we tell "up" from "never arrived". */
  function widgetUp(){
    return !!(slot && slot.childElementCount > 0);
  }

  /* Safety net if implicit rendering found nothing. Checks the METHOD, never
     just the object — window.turnstile can exist while render() does not. */
  setTimeout(() => {
    if (widgetUp() || token) return;
    if (!window.turnstile || typeof window.turnstile.render !== "function") return;
    try {
      slot.classList.remove("cf-turnstile");
      window.turnstile.render("#ts-widget", {
        sitekey: slot.dataset.sitekey,
        theme: "dark",
        callback: window.onSuccess,
        "error-callback": window.onError,
        "expired-callback": window.onExpired,
      });
    } catch (err) { console.error("fallback render threw:", err); }
  }, 4000);

  /* Ad blockers routinely block challenges.cloudflare.com — and this audience
     runs them. Say so where the widget should have been, and point the joke at
     the blocker, never at the person. */
  setTimeout(() => {
    if (token || widgetUp()) return;
    gateNote(!window.turnstile
      ? "// Your ad blocker just bounced our bot-check, so SEND TO BLOG is stuck. Allow challenges.cloudflare.com and reload — SEND TO VOID never needed it."
      : "// Cloudflare refused the badge for this sitekey on " + location.hostname + ". That's our end, not your browser.");
  }, 10000);
</script>
<!-- defer, NOT async: async executes the moment it downloads, which on this
     page happens before the parser reaches #ts-widget (it sits behind a large
     inline stylesheet). Turnstile scans for .cf-turnstile once on execution,
     finds nothing, and never renders. defer guarantees a parsed DOM. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</body>
</html>
